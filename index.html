<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1035" />
<title>双节祝福</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    position: fixed;
    inset: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #060a24 0%, #0b1035 35%, #14184d 65%, #1d1a4a 85%, #2a1e52 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- 星空 ---------- */
  #stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* ---------- 金色代码雨 ---------- */
  #rain {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------- 月亮 ---------- */
  #moon {
    position: absolute;
    top: 9%;
    right: 12%;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffbe8 0%, #ffeaa0 45%, #f7c948 78%, #e8ae2f 100%);
    box-shadow:
      0 0 24px rgba(255, 229, 153, 0.65),
      0 0 64px rgba(255, 214, 102, 0.35),
      0 0 120px rgba(255, 200, 80, 0.18);
    opacity: 0;
    transform: translateY(40px) scale(0.6);
    transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.22, 1, 0.36, 1);
  }

  #moon.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* 月晕缓慢呼吸 */
  #moon::after {
    content: "";
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 170, 0.16) 0%, transparent 70%);
    animation: moonBreath 4s ease-in-out infinite;
  }

  @keyframes moonBreath {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.18); opacity: 1; }
  }

  /* ---------- 烟花画布 ---------- */
  #fireworks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---------- 粒子汇聚文字 ---------- */
  #textParticles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 22;
  }

  /* ---------- 中央按钮 ---------- */
  #startBtn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 18px 34px;
    font-size: 17px;
    letter-spacing: 2px;
    font-weight: 600;
    color: #fff3d6;
    background: linear-gradient(145deg, #d4442e 0%, #b32d20 55%, #8f1f18 100%);
    border: 1px solid rgba(255, 210, 140, 0.55);
    border-radius: 999px;
    box-shadow:
      0 6px 22px rgba(211, 68, 46, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    cursor: pointer;
    z-index: 30;
    outline: none;
    transition: transform 0.2s ease, opacity 0.7s ease, box-shadow 0.3s ease;
    animation: btnPulse 2.2s ease-in-out infinite;
  }

  #startBtn:active {
    transform: translate(-50%, -50%) scale(0.95);
  }

  #startBtn.hide {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.15);
    pointer-events: none;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 6px 22px rgba(211, 68, 46, 0.5), inset 0 1px 0 rgba(255,255,255,0.25), 0 0 0 0 rgba(255, 190, 120, 0.45); }
    50% { box-shadow: 0 6px 26px rgba(211, 68, 46, 0.65), inset 0 1px 0 rgba(255,255,255,0.25), 0 0 0 14px rgba(255, 190, 120, 0); }
  }

  /* ---------- 祝福文案 ---------- */
  #blessing {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 0 8vw;
    text-align: center;
    z-index: 20;
    pointer-events: none;
    }

    /* 文案区柔和暗色衬托，保证合影背景上的可读性 */
    #blessing::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 132%;
    height: 74%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center,
      rgba(6, 10, 36, 0.78) 0%,
      rgba(6, 10, 36, 0.55) 42%,
      rgba(6, 10, 36, 0.18) 68%,
      transparent 82%);
    pointer-events: none;
    z-index: -1;
    }

  .line {
    opacity: 0;
    transform: translateY(26px) scale(0.94);
    filter: blur(4px);
  }

  .line.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
    transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
  }

  .title {
    font-size: clamp(30px, 9.5vw, 46px);
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #ffe9b0 15%, #ffc45e 55%, #ff9a3d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 22px rgba(255, 170, 60, 0.25);
  }

  .subtitle {
    font-size: clamp(15px, 4.4vw, 20px);
    letter-spacing: 6px;
    color: #ffd9a0;
    opacity: 0.95;
  }

  .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 205, 130, 0.8), transparent);
    margin: 4px 0;
  }

  .body-text {
    font-size: clamp(14px, 4vw, 18px);
    line-height: 1.9;
    letter-spacing: 2px;
    color: rgba(255, 240, 215, 0.92);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .sign {
    font-size: clamp(13px, 3.6vw, 16px);
    letter-spacing: 3px;
    color: rgba(255, 226, 178, 0.8);
    margin-top: 6px;
  }

  /* 标题金色微光 */
  .title.show {
    animation: titleShine 3.2s ease-in-out 1.2s infinite;
  }

  @keyframes titleShine {
    0%, 100% { filter: brightness(1) blur(0); }
    50% { filter: brightness(1.25) blur(0); }
  }

  /* ---------- 整体晕影 / 层次感 ---------- */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 35%, transparent 0%, rgba(0, 0, 0, 0.18) 70%, rgba(0, 0, 0, 0.55) 100%),
    linear-gradient(180deg, rgba(8, 10, 38, 0) 60%, rgba(8, 10, 38, 0.45) 100%);
  z-index: 4;
  opacity: 0;
  transition: opacity 1.8s ease;
}
.vignette.show { opacity: 1; }

/* ---------- 边角祥云纹饰 ---------- */
.corner {
  position: absolute;
  width: 92px;
  height: 92px;
  pointer-events: none;
  opacity: 0;
  z-index: 14;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
  transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.corner.tl { top: calc(14px + env(safe-area-inset-top)); left: 14px; }
.corner.tr { top: calc(14px + env(safe-area-inset-top)); right: 14px; transform: scaleX(-1); }
.corner.bl { bottom: calc(16px + env(safe-area-inset-bottom)); left: 14px; transform: scaleY(-1); }
.corner.br { bottom: calc(16px + env(safe-area-inset-bottom)); right: 14px; transform: scale(-1, -1); }
.corner.tl.show { opacity: 0.9; transform: translate(0, 0); }
.corner.tr.show { opacity: 0.9; transform: scaleX(-1) translate(0, 0); }
.corner.bl.show { opacity: 0.85; transform: scaleY(-1) translate(0, 0); }
.corner.br.show { opacity: 0.85; transform: scale(-1, -1) translate(0, 0); }

/* ---------- 顶部丝带标题 ---------- */
.ribbon {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  transform: translate(-50%, -18px);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px 7px 12px;
  border-radius: 999px;
  background: linear-gradient(95deg, rgba(212, 68, 46, 0.22), rgba(255, 196, 94, 0.18) 60%, rgba(255, 217, 160, 0.22));
  border: 1px solid rgba(255, 207, 130, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.16);
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.9s ease 0.3s, transform 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
}
.ribbon.show { opacity: 1; transform: translate(-50%, 0); }
.ribbon svg { width: 18px; height: 18px; flex-shrink: 0; filter: drop-shadow(0 1px 4px rgba(255, 200, 100, 0.55)); }
.ribbon span {
  font-size: 13px;
  letter-spacing: 3px;
  font-weight: 600;
  background: linear-gradient(90deg, #ffe9b0 0%, #ffb46b 50%, #ffe9b0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
}

/* ---------- 印章 ---------- */
.seal {
  position: absolute;
  width: 84px;
  height: 84px;
  pointer-events: none;
  z-index: 26;
  opacity: 0;
  transform: rotate(-14deg) scale(0.4);
  transition: opacity 0.9s ease 1.1s, transform 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s;
  filter: drop-shadow(0 6px 16px rgba(220, 38, 38, 0.5));
}
.seal.br { right: 18px; bottom: calc(72px + env(safe-area-inset-bottom)); }
.seal.show { opacity: 1; transform: rotate(-14deg) scale(1); }

/* ---------- 底部云海波纹 ---------- */
.cloud-band {
  position: absolute;
  left: 0;
  right: 0;
  height: 90px;
  pointer-events: none;
  z-index: 6;
  opacity: 0;
  transition: opacity 1.6s ease 0.6s;
}
.cloud-band.bottom {
  bottom: 0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 100%, rgba(255, 217, 160, 0.18) 0%, transparent 70%),
    linear-gradient(180deg, transparent, rgba(8, 10, 38, 0.5) 100%);
}
.cloud-band.show { opacity: 1; }

/* ---------- 标题图标 ---------- */
.title-wrap {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}
.title-icon {
  width: clamp(26px, 7vw, 34px);
  height: clamp(26px, 7vw, 34px);
  flex-shrink: 0;
  filter: drop-shadow(0 3px 10px rgba(255, 170, 60, 0.55));
}

/* ---------- 按钮图标 ---------- */
#startBtn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
#startBtn svg {
  width: 18px;
  height: 18px;
  filter: drop-shadow(0 0 4px rgba(255, 220, 150, 0.6));
}

/* ---------- 卡通合影背景层 ---------- */
#characters {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 7;
  opacity: 0;
  transition: opacity 1.2s ease;
}
#characters.show { opacity: 1; }

/* ---------- 灯笼 ---------- */
  .lantern {
    position: absolute;
    top: -120px;
    z-index: 15;
    width: 44px;
    pointer-events: none;
    opacity: 0;
    animation: lanternFloat 14s linear forwards;
  }

  .lantern .body {
    position: relative;
    width: 44px;
    height: 54px;
    border-radius: 46% / 50%;
    background: radial-gradient(circle at 42% 34%, #ff8a5c 0%, #e6382a 55%, #a81f16 100%);
    box-shadow: 0 0 18px rgba(255, 110, 60, 0.55), inset -4px -4px 10px rgba(120, 10, 5, 0.5);
  }

  .lantern .body::before, .lantern .body::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(180deg, #ffd9a0, #c9963f);
  }
  .lantern .body::before { top: -4px; }
  .lantern .body::after { bottom: -4px; }

  .lantern .tassel {
    position: absolute;
    left: 50%;
    top: 58px;
    transform: translateX(-50%);
    width: 3px;
    height: 20px;
    background: linear-gradient(180deg, #ffd9a0, transparent);
    border-radius: 2px;
  }

  .lantern .rope {
    position: absolute;
    left: 50%;
    top: -34px;
    transform: translateX(-50%);
    width: 2px;
    height: 32px;
    background: rgba(255, 216, 160, 0.5);
  }

  @keyframes lanternFloat {
    0%   { transform: translate(0, 0) rotate(-4deg); opacity: 0; }
    6%   { opacity: 1; }
    50%  { transform: translate(14px, 55vh) rotate(5deg); }
    90%  { opacity: 1; }
    100% { transform: translate(-8px, 112vh) rotate(-4deg); opacity: 0; }
  }

  /* ---------- 漂浮光点 ---------- */
  .mote {
    position: absolute;
    bottom: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 224, 160, 0.9), rgba(255, 224, 160, 0) 70%);
    pointer-events: none;
    z-index: 12;
    animation: moteRise linear infinite;
  }

  @keyframes moteRise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    12% { opacity: 0.9; }
    85% { opacity: 0.5; }
    100% { transform: translateY(-105vh) translateX(20px); opacity: 0; }
  }

  /* ---------- 底部提示 ---------- */
  #replayTip {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 2px;
    color: rgba(255, 235, 200, 0.55);
    z-index: 25;
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  #replayTip.show { opacity: 1; }

  /* ---------- 固定水印 ---------- */
  #watermark {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: rgba(255, 233, 190, 0.6);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    z-index: 40;
    pointer-events: none;   /* 不拦截任何触摸 / 点击交互 */
    user-select: none;
    -webkit-user-select: none;
  }

  @media (orientation: landscape) and (max-height: 480px) {
    .title { font-size: 28px; }
    #moon { width: 64px; height: 64px; top: 6%; }
    .corner { width: 64px; height: 64px; }
    .seal { width: 64px; height: 64px; }
    .ribbon { padding: 5px 12px; }
    .ribbon span { font-size: 11px; letter-spacing: 2px; }
  }

  @media (min-width: 768px) {
    .corner { width: 120px; height: 120px; }
    .seal { width: 104px; height: 104px; }
    .ribbon span { font-size: 14px; letter-spacing: 4px; }
  }

  /* ---------- 背景音乐控制面板（右上角，半透明磨砂，与整体红金风格统一） ---------- */
  #musicPanel {
    position: fixed;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px 8px 8px;
    border-radius: 999px;
    background: rgba(20, 18, 50, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 217, 140, 0.35);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    color: #ffe9b0;
    font-size: 12px;
    letter-spacing: 1px;
    z-index: 28;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.5s ease, transform 0.4s ease;
  }
  #musicPanel.ready { opacity: 1; transform: translateY(0); }
  #musicPanel .mp-btn {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 217, 140, 0.6);
    background: linear-gradient(145deg, #d4442e 0%, #b32d20 55%, #8f1f18 100%);
    color: #fff3d6;
    cursor: pointer;
    padding: 0;
    outline: none;
    box-shadow: 0 2px 8px rgba(211, 68, 46, 0.5);
    transition: transform 0.15s ease, filter 0.2s ease;
  }
  #musicPanel .mp-btn:hover { filter: brightness(1.1); }
  #musicPanel .mp-btn:active { transform: scale(0.92); }
  #musicPanel .mp-btn svg { width: 14px; height: 14px; display: block; }
  /* 播放中按钮呼吸光晕，与整体动画风格一致 */
  #musicPanel .mp-btn.playing {
    animation: mpPulse 2.4s ease-in-out infinite;
  }
  @keyframes mpPulse {
    0%, 100% { box-shadow: 0 2px 8px rgba(211, 68, 46, 0.5), 0 0 0 0 rgba(255, 217, 140, 0.0); }
    50%      { box-shadow: 0 2px 12px rgba(211, 68, 46, 0.7), 0 0 12px 2px rgba(255, 217, 140, 0.35); }
  }
  #musicPanel .mp-vol {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 233, 176, 0.25);
    outline: none;
    cursor: pointer;
  }
  #musicPanel .mp-vol::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffe9b0;
    border: 1px solid #c9963f;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255, 217, 140, 0.6);
  }
  #musicPanel .mp-vol::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffe9b0;
    border: 1px solid #c9963f;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255, 217, 140, 0.6);
  }
  #musicPanel .mp-status {
    max-width: 0;
    overflow: hidden;
    white-space: nowrap;
    color: #ffd180;
    opacity: 0;
    transition: max-width 0.4s ease, opacity 0.3s ease;
  }
  #musicPanel .mp-status.show { max-width: 220px; opacity: 1; }
  @media (max-width: 480px) {
    #musicPanel { top: 10px; right: 10px; padding: 6px 8px; font-size: 11px; gap: 6px; }
    #musicPanel .mp-vol { width: 60px; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <canvas id="rain"></canvas>
  <div class="vignette" id="vignette"></div>
  <div class="cloud-band bottom" id="cloudBand"></div>
  <canvas id="characters"></canvas>
  <div id="moon"></div>
  <canvas id="fireworks"></canvas>
  <canvas id="textParticles"></canvas>

  <!-- 顶部丝带标题 -->
  <div class="ribbon" id="ribbon">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="ribbonMoon" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fff3cf"/>
          <stop offset="100%" stop-color="#ffc45e"/>
        </linearGradient>
      </defs>
      <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="url(#ribbonMoon)"/>
      <circle cx="7" cy="9" r="0.9" fill="#fffbe8"/>
      <circle cx="9.5" cy="13.5" r="0.7" fill="#fffbe8" opacity="0.7"/>
    </svg>
    <span>双节同庆 · 山河无恙</span>
  </div>

  <!-- 四角祥云纹饰（共享 defs） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.95"/>
        <stop offset="55%" stop-color="#ffd180" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#c9963f" stop-opacity="0.35"/>
      </linearGradient>
      <symbol id="cloudOrn" viewBox="0 0 100 100">
        <path d="M8 78 C 8 50, 28 24, 56 18 C 78 14, 92 24, 94 38" stroke="url(#cg)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M16 60 C 20 48, 32 40, 46 42 C 36 44, 26 52, 24 62 Z" stroke="url(#cg)" stroke-width="1.2" fill="rgba(255,217,160,0.06)" stroke-linejoin="round"/>
        <path d="M58 30 C 66 28, 72 32, 70 40 C 76 38, 82 42, 80 50" stroke="url(#cg)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <circle cx="38" cy="34" r="1.8" fill="#ffe9b0"/>
        <circle cx="74" cy="44" r="1.6" fill="#ffd180" opacity="0.85"/>
        <circle cx="20" cy="64" r="1.4" fill="#ffd180" opacity="0.65"/>
      </symbol>
    </defs>
  </svg>
  <svg class="corner tl" viewBox="0 0 100 100" aria-hidden="true"><use href="#cloudOrn"/></svg>
  <svg class="corner tr" viewBox="0 0 100 100" aria-hidden="true"><use href="#cloudOrn"/></svg>
  <svg class="corner bl" viewBox="0 0 100 100" aria-hidden="true"><use href="#cloudOrn"/></svg>
  <svg class="corner br" viewBox="0 0 100 100" aria-hidden="true"><use href="#cloudOrn"/></svg>

  <!-- 印章 -->
  <svg class="seal br" id="seal" viewBox="0 0 84 84" aria-hidden="true">
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#e6382a"/>

  <!-- 背景音乐源：src 带 ?v= 版本号 —— 每次更换 bgm.mp3 后同步更新版本号，可强制手机浏览器拉取最新文件而非使用缓存。 -->
